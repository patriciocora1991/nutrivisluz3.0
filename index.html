<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CalcuPlan Pro - Recetario y Suplementación</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --border-color: #334155;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        h1, h2 {
            color: var(--accent-color);
        }
        .panel-principal {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            margin-bottom: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            align-items: center;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        label {
            font-size: 0.9rem;
            font-weight: bold;
        }
        select {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: #0f172a;
            color: white;
            font-size: 1rem;
        }
        .suplementacion-box {
            background-color: #0284c715;
            border-left: 4px solid var(--accent-color);
            padding: 15px;
            border-radius: 0 8px 8px 0;
            margin-bottom: 20px;
            display: none;
        }
        .recetas-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
        }
        .receta-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            transition: transform 0.2s;
        }
        .receta-card:hover {
            transform: translateY(-3px);
            border-color: var(--accent-color);
        }
        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            background-color: #334155;
            color: var(--accent-color);
            margin-bottom: 8px;
        }
        .macros {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-top: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>CalcuPlan Pro</h1>
    <p>Panel de Control Nutricional y Recetario (90 Opciones)</p>

    <!-- Panel de Opciones Principales -->
    <div class="panel-principal">
        <div class="control-group">
            <label for="filtroTipo">Filtrar por Tipo de Comida:</label>
            <select id="filtroTipo" onchange="renderizarApp()">
                <option value="Todos">Todas (90 opciones)</option>
                <option value="Desayuno">Desayuno</option>
                <option value="Colación">Colación</option>
                <option value="Almuerzo/Cena">Almuerzo / Cena</option>
            </select>
        </div>

        <div class="control-group">
            <label for="selectSuplemento">¿Sugerir Suplementación?</label>
            <select id="selectSuplemento" onchange="renderizarApp()">
                <option value="No">No</option>
                <option value="Sí">Sí</option>
            </select>
        </div>
    </div>

    <!-- Módulo Dinámico de Suplementación -->
    <div id="seccionSuplementacion" class="suplementacion-box">
        <h3>💊 Sugerencias de Suplementación Activas</h3>
        <ul id="listaSuplementos" style="margin: 0; padding-left: 20px;"></ul>
    </div>

    <!-- Listado de Recetas -->
    <h2>Recetario Disponible (<span id="contadorRecetas">0</span>)</h2>
    <div id="gridRecetas" class="recetas-grid"></div>
</div>

<script>
    // 1. Generación de la Base de Datos de 90 Recetas
    function generarBaseDeDatos() {
        let recetas = [];
        let categorias = ["Desayuno", "Colación", "Almuerzo/Cena"];
        
        for (let i = 1; i <= 90; i++) {
            let catIndex = (i <= 30) ? 0 : (i <= 60) ? 1 : 2;
            recetas.push({
                id: i,
                nombre: `Receta Opción #${i}`,
                tipo: categorias[catIndex],
                calorias: 250 + (i * 7) % 400,
                proteinas: 10 + (i * 3) % 30,
                carbos: 20 + (i * 4) % 50,
                grasas: 8 + (i * 2) % 15
            });
        }
        return recetas;
    }

    const baseDatosRecetas = generarBaseDeDatos();

    // 2. Lógica de renderizado principal
    function renderizarApp() {
        const tipoSeleccionado = document.getElementById('filtroTipo').value;
        const quiereSuplemento = document.getElementById('selectSuplemento').value;

        // Filtrar recetas
        let recetasFiltradas = baseDatosRecetas;
        if (tipoSeleccionado !== 'Todos') {
            recetasFiltradas = baseDatosRecetas.filter(r => r.tipo === tipoSeleccionado);
        }

        // Actualizar contador y grilla de recetas
        document.getElementById('contadorRecetas').innerText = recetasFiltradas.length;
        const grid = document.getElementById('gridRecetas');
        grid.innerHTML = '';

        recetasFiltradas.forEach(receta => {
            const card = document.createElement('div');
            card.className = 'receta-card';
            card.innerHTML = `
                <span class="badge">${receta.tipo}</span>
                <h4 style="margin: 0 0 8px 0;">${receta.nombre}</h4>
                <div class="macros">
                    🔥 ${receta.calorias} kcal | 🍗 P: ${receta.proteinas}g | 🥔 C: ${receta.carbos}g | 🥑 G: ${receta.grasas}g
                </div>
            `;
            grid.appendChild(card);
        });

        // Gestionar sección de suplementación condicional
        const cajaSuplemento = document.getElementById('seccionSuplementacion');
        const listaSuplementos = document.getElementById('listaSuplementos');
        
        if (quiereSuplemento === 'Sí') {
            cajaSuplemento.style.display = 'block';
            listaSuplementos.innerHTML = `
                <li><strong>Creatina Monohidrato:</strong> 3 a 5g diarios (Post-entrenamiento o toma fija diaria).</li>
                <li><strong>Proteína de Suero (Whey Protein):</strong> 20 a 25g post-esfuerzo para síntesis proteica óptima.</li>
                <li><strong>Electrolitos + Carbohidratos:</strong> Indicado para sesiones de alta exigencia o duración prolongada.</li>
            `;
        } else {
            cajaSuplemento.style.display = 'none';
        }
    }

    // Inicializar al cargar
    window.onload = renderizarApp;
</script>

</body>
</html>
