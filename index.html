<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de Receta - Plan Nutricional</title>
    <style>
        :root {
            --bg-color: #121214;
            --card-bg: #1e1e24;
            --text-primary: #f4f4f5;
            --text-secondary: #a1a1aa;
            --accent-color: #3b82f6;
            --border-color: #27272a;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .recipe-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .recipe-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        .recipe-icon {
            font-size: 28px;
        }

        .recipe-title {
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--text-primary);
            margin: 0;
        }

        .ingredients-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--accent-color);
            margin-bottom: 12px;
            font-weight: 700;
        }

        .ingredients-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .ingredients-list li {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 0.95rem;
        }

        .ingredients-list li:last-child {
            border-bottom: none;
        }

        .ingredient-name {
            color: var(--text-primary);
        }

        .ingredient-weight {
            color: var(--text-secondary);
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="recipe-card">
        <div class="recipe-header">
            <div class="recipe-icon">🥞</div>
            <h2 class="recipe-title">Waffles proteicos de avena y banana con frutos rojos</h2>
        </div>
        
        <div class="ingredients-title">Desglose de Ingredientes (Operativo)</div>
        
        <ul class="ingredients-list">
            <li>
                <span class="ingredient-name">Avena</span>
                <span class="ingredient-weight">40 g</span>
            </li>
            <li>
                <span class="ingredient-name">Banana</span>
                <span class="ingredient-weight">1 unidad chica (100 g)</span>
            </li>
            <li>
                <span class="ingredient-name">Huevo</span>
                <span class="ingredient-weight">1 unidad (50 g)</span>
            </li>
            <li>
                <span class="ingredient-name">Leche</span>
                <span class="ingredient-weight">40 ml</span>
            </li>
            <li>
                <span class="ingredient-name">Frutos rojos (arándanos / frutillas)</span>
                <span class="ingredient-weight">50 g</span>
            </li>
        </ul>
    </div>

</body>
</html>
