<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CalcuPlan Pro - Panel Nutricional Unificado</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --danger-color: #f43f5e;
            --border-color: #334155;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }
        h1, h2 {
            color: var(--accent-color);
            margin-bottom: 5px;
        }
        .subtitle {
            color: #94a3b8;
            margin-bottom: 25px;
        }
        .panel-principal {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            margin-bottom: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            align-items: center;
            border: 1px solid var(--border-color);
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        label {
            font-size: 0.85rem;
            font-weight: bold;
            color: #cbd5e1;
        }
        select, input[type="text"] {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: #0f172a;
            color: white;
            font-size: 0.95rem;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 5px;
            font-size: 0.9rem;
            cursor: pointer;
        }
        .suplementacion-box {
            background-color: #0284c715;
            border-left: 4px solid var(--accent-color);
            padding: 15px;
            border-radius: 0 8px 8px 0;
            margin-bottom: 20px;
            display: none;
            border: 1px solid var(--border-color);
        }
        .recetas-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
        }
        .receta-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            transition: transform 0.2s, border-color 0.2s;
            position: relative;
        }
        .receta-card:hover {
            transform: translateY(-3px);
            border-color: var(--accent-color);
        }
        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            background-color: #334155;
            color: var(--accent-color);
            margin-bottom: 8px;
        }
        .badge-excluida {
            background-color: var(--danger-color);
            color: white;
        }
        .macros {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-top: 8px;
        }
        .stats-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>CalcuPlan Pro</h1>
    <p class="subtitle">Sistema Integral de Planificación Nutricional y Rendimiento</p>

    <!-- Panel de Control Principal Unificado -->
    <div class="panel-principal">
        <div class="control-group">
            <label for="filtroTipo">Tipo de Comida:</label>
            <select id="filtroTipo" onchange="renderizarApp()">
                <option value="Todos">Todas (90 opciones)</option>
                <option value="Desayuno">Desayuno</option>
                <option value="Colación">Colación</option>
                <option value="Almuerzo/Cena">Almuerzo / Cena</option>
            </select>
        </div>

        <div class="control-group">
            <label for="selectSuplemento">Sugerir Suplementación:</label>
            <select id="selectSuplemento" onchange="renderizarApp()">
                <option value="No">No</option>
                <option value="Sí">Sí</option>
            </select>
        </div>

        <div class="control-group">
            <label>Filtros de Exclusión:</label>
            <label class="checkbox-group">
                <input type="checkbox" id="excluirCarnesDesayuno" onchange="renderizarApp()" checked> 
                Restringir Carnes/Pescados en Desayuno
            </label>
        </div>
    </div>

    <!-- Módulo Dinámico de Suplementación -->
    <div id="seccionSuplementacion" class="suplementacion-box">
        <h3>💊 Sugerencias de Suplementación Activas</h3>
        <ul id="listaSuplementos" style="margin: 0; padding-left: 20px; font-size: 0.95rem;"></ul>
    </div>

    <!-- Barra de Estado y Conteo -->
    <div class="stats-bar">
        <h2>Recetario Disponible</h2>
        <span style="font-size: 1rem; color: var(--accent-color); font-weight: bold;">
            Mostrando <span id="contadorRecetas">0</span> de 90 opciones
        </span>
    </div>

    <!-- Listado de Recetas -->
    <div id="gridRecetas" class="recetas-grid"></div>
</div>

<script>
    // 1. Generación de la Base de Datos de 90 Recetas Integrada
    function generarBaseDeDatos() {
        let recetas = [];
        let categorias = ["Desayuno", "Colación", "Almuerzo/Cena"];
        let ingredientesBase = ["Huevos y Avena", "Frutos Secos y Yogur", "Pechuga de Pollo", "Filete de Merluza", "Tostadas Integrales", "Batido Proteico", "Arroz con Atún", "Queso Untable y Semillas"];
        
        for (let i = 1; i <= 90; i++) {
            let catIndex = (i <= 30) ? 0 : (i <= 60) ? 1 : 2;
            let categoriaActual = categorias[catIndex];
            
            // Simular presencia de carnes/pescados en algunas recetas para el filtro de exclusión
            let tieneProteinaPesada = (i % 4 === 0 || i % 7 === 0) && categoriaActual === "Desayuno";
            let nombreIngrediente = ingredientesBase[i % ingredientesBase.length];

            recetas.push({
                id: i,
                nombre: `Receta #${i} (${nombreIngrediente})`,
                tipo: categoriaActual,
                contieneProteinaPesada: tieneProteinaPesada,
                calorias: 250 + (i * 7) % 450,
                proteinas: 12 + (i * 3) % 35,
                carbos: 20 + (i * 4) % 55,
                grasas: 6 + (i * 2) % 18
            });
        }
        return recetas;
    }

    const baseDatosRecetas = generarBaseDeDatos();

    // 2. Lógica de renderizado y filtros integrados
    function renderizarApp() {
        const tipoSeleccionado = document.getElementById('filtroTipo').value;
        const quiereSuplemento = document.getElementById('selectSuplemento').value;
        const excluirCarnesDesayuno = document.getElementById('excluirCarnesDesayuno').checked;

        // Filtrado de recetas
        let recetasFiltradas = baseDatosRecetas.filter(receta => {
            // Filtro por tipo
            if (tipoSeleccionado !== 'Todos' && receta.tipo !== tipoSeleccionado) {
                return false;
            }
            // Filtro de exclusión de carnes/pescados pesados en desayunos
            if (excluirCarnesDesayuno && receta.tipo === 'Desayuno' && receta.contieneProteinaPesada) {
                return false;
            }
            return true;
        });

        // Actualizar contador
        document.getElementById('contadorRecetas').innerText = recetasFiltradas.length;
        
        // Renderizar grilla de tarjetas
        const grid = document.getElementById('gridRecetas');
        grid.innerHTML = '';

        recetasFiltradas.forEach(receta => {
            const card = document.createElement('div');
            card.className = 'receta-card';
            card.innerHTML = `
                <span class="badge">${receta.tipo}</span>
                ${receta.contieneProteinaPesada ? '<span class="badge badge-excluida">Proteína Pesada</span>' : ''}
                <h4 style="margin: 0 0 8px 0;">${receta.nombre}</h4>
                <div class="macros">
                    🔥 ${receta.calorias} kcal | 🍗 P: ${receta.proteinas}g | 🥔 C: ${receta.carbos}g | 🥑 G: ${receta.grasas}g
                </div>
            `;
            grid.appendChild(card);
        });

        // Gestión visual de suplementación condicional
        const cajaSuplemento = document.getElementById('seccionSuplementacion');
        const listaSuplementos = document.getElementById('listaSuplementos');
        
        if (quiereSuplemento === 'Sí') {
            cajaSuplemento.style.display = 'block';
            listaSuplementos.innerHTML = `
                <li><strong>Creatina Monohidrato:</strong> 3 a 5g diarios (Optimización de fuerza y alta intensidad).</li>
                <li><strong>Proteína de Suero (Whey Protein):</strong> 20 a 25g post-esfuerzo para síntesis proteica óptima.</li>
                <li><strong>Electrolitos + Carbohidratos:</strong> Recomendado para sesiones intensas o prolongadas.</li>
            `;
        } else {
            cajaSuplemento.style.display = 'none';
        }
    }

    // Inicializar aplicación al cargar la página
    window.onload = renderizarApp;
</script>

</body>
</html>
